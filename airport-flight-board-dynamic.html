<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>多國機場翻頁時刻表 (動態查詢版)</title>
<style>
  body {
    margin: 0;
    background-color: #050505;
    color: #fff;
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  
  /* 頂部機場資訊與時鐘 */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 95%;
    max-width: 1100px;
    margin-bottom: 20px;
    border-bottom: 1px solid #333;
    padding-bottom: 12px;
  }
  .airport-info {
    color: #e6a822; /* 航站標示黃色 */
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .realtime-clock {
    color: #e6a822;
    font-size: 22px;
    font-weight: bold;
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .airport-input {
    background-color: #1a1a1a;
    color: #e6a822;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 16px;
    width: 150px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    text-transform: uppercase;
    transition: all 0.3s;
  }
  .airport-input:focus {
    outline: none;
    border-color: #e6a822;
    background-color: #222;
  }
  .airport-input::placeholder {
    color: #666;
    text-transform: none;
    font-size: 14px;
  }

  .board {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 95%;
    max-width: 1100px;
  }
  .header, .row {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .header div {
    color: #aaa;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
  }
  .flap-container {
    display: flex;
    gap: 3px;
    justify-content: center;
  }
  .flap {
    width: 36px;
    height: 50px;
    background-color: #1a1a1a;
    color: #f0f0f0;
    font-size: 28px;
    font-weight: bold;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 4px;
    position: relative;
    box-shadow: 0 4px 6px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.15);
    font-family: "Courier New", Courier, monospace;
  }
  /* 針對中文字微調字體 */
  .flap.zh {
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 24px;
  }
  .flap::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    height: 2px;
    background-color: #000;
    box-shadow: 0 1px 0 rgba(255,255,255,0.1);
  }
  
  /* 寬度設定 (依照字數分配) */
  .col-time { width: 190px; }      /* 5字 */
  .col-dest { width: 160px; }      /* 4字 (中文) */
  .col-flight { width: 230px; }    /* 6字 */
  .col-gate { width: 80px; }       /* 2字 */
  .col-remarks { width: 160px; }   /* 4字 (中文) */

  /* iPad Portrait */
  @media (max-width: 1024px) and (orientation: portrait) {
    .col-remarks, .flap-remarks { display: none !important; }
    .flap { width: 32px; height: 46px; font-size: 24px; }
    .flap.zh { font-size: 20px; }
    .airport-info { font-size: 18px; }
    .realtime-clock { font-size: 18px; }
  }

  /* iPhone / Mobile Portrait */
  @media (max-width: 768px) {
    .top-bar {
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding-bottom: 8px;
    }
    .airport-info { 
      font-size: 16px; 
      justify-content: center;
      text-align: center;
    }
    .realtime-clock { font-size: 16px; }
    .airport-input { width: 130px; padding: 4px 8px; font-size: 14px; }
    
    .col-gate, .flap-gate { display: none !important; }
    .col-remarks, .flap-remarks { display: none !important; }
    .col-flight { width: 160px; }
    .flap { width: 24px; height: 38px; font-size: 20px; }
    .flap.zh { font-size: 18px; }
    .board { gap: 8px; }
    .header div { font-size: 12px; }
  }

  .audio-unlock {
    position: absolute;
    top: 20px;
    color: #888;
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    background: rgba(0,0,0,0.5);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid #333;
    z-index: 10;
  }
</style>
</head>
<body>

<div class="audio-unlock" id="unlock-msg">👆 點擊螢幕任意處啟用音效與翻頁</div>

<div class="top-bar">
  <div class="airport-info">
    <span>✈ <span id="airport-name">臺北松山機場 (TSA)</span></span>
    <input type="text" id="airport-input" class="airport-input" placeholder="輸入簡碼 (如 TPE)" maxlength="3" autocomplete="off">
  </div>
  <div class="realtime-clock" id="clock">--:--:--</div>
</div>

<div class="board" id="board">
  <div class="header">
    <div class="col-time">時間 TIME</div>
    <div class="col-dest">地區 DEST</div>
    <div class="col-flight">航班 FLIGHT</div>
    <div class="col-gate">登機 GATE</div>
    <div class="col-remarks">狀態 REMARKS</div>
  </div>
  <!-- 初始靜態內容，避免畫面全黑 -->
</div>

<script>
// --- 機場資料庫與動態切換 ---
const airportDB = {
  "TSA": { name: "臺北松山機場", dests: ["金門", "澎湖", "台東", "馬祖", "東京羽田", "首爾金浦", "上海浦東", "廈門"], airlines: ["立榮", "華信", "虎航", "長榮", "華航"] },
  "TPE": { name: "桃園國際機場", dests: ["東京成田", "大阪關西", "首爾仁川", "曼谷", "洛杉磯", "舊金山", "新加坡", "香港", "澳門"], airlines: ["長榮", "華航", "星宇", "虎航", "國泰"] },
  "KHH": { name: "高雄國際機場", dests: ["香港", "澳門", "東京成田", "大阪關西", "沖繩", "首爾仁川", "曼谷", "胡志明市", "金門", "澎湖"], airlines: ["華航", "長榮", "虎航", "國泰", "立榮"] },
  "NRT": { name: "東京成田機場", dests: ["台北桃園", "高雄", "首爾仁川", "洛杉磯", "紐約", "倫敦", "巴黎", "雪梨", "曼谷"], airlines: ["日航", "全日空", "長榮", "華航", "星宇", "聯合"] },
  "HND": { name: "東京羽田機場", dests: ["台北松山", "首爾金浦", "北京首都", "上海虹橋", "倫敦", "巴黎", "紐約", "洛杉磯", "舊金山"], airlines: ["日航", "全日空", "長榮", "華航", "達美"] },
  "HKG": { name: "香港國際機場", dests: ["台北桃園", "高雄", "東京成田", "大阪關西", "首爾仁川", "曼谷", "新加坡", "倫敦", "紐約"], airlines: ["國泰", "快運", "長榮", "華航", "星宇", "英航"] },
  "KIX": { name: "大阪關西機場", dests: ["台北桃園", "高雄", "首爾仁川", "曼谷", "新加坡", "洛杉磯", "上海浦東", "香港"], airlines: ["日航", "全日空", "樂桃", "長榮", "華航", "星宇"] },
  "SIN": { name: "新加坡樟宜", dests: ["台北桃園", "東京成田", "倫敦", "雪梨", "曼谷", "吉隆坡", "巴黎", "洛杉磯", "首爾仁川"], airlines: ["新航", "酷航", "長榮", "華航", "國泰"] }
};

let currentCode = "TSA";
let currentDests = airportDB["TSA"].dests;
let currentAirlines = airportDB["TSA"].airlines;

document.getElementById('airport-input').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') {
    let code = this.value.trim().toUpperCase();
    if (code.length > 0) {
      currentCode = code;
      let info = airportDB[code];
      if (info) {
        document.getElementById('airport-name').textContent = info.name + " (" + code + ")";
        currentDests = info.dests;
        currentAirlines = info.airlines;
      } else {
        document.getElementById('airport-name').textContent = "國際機場 (" + code + ")";
        currentDests = ["台北桃園", "東京", "首爾", "香港", "曼谷", "新加坡", "倫敦", "紐約", "洛杉磯", "巴黎"];
        currentAirlines = ["長榮", "華航", "星宇", "國泰", "日航", "聯合", "達美", "阿聯酋"];
      }
      this.blur(); // 隱藏鍵盤
      enableAudio();
      updateBoard(); // 立即刷新航班面板
    }
  }
});

// --- 即時時鐘邏輯 ---
function updateClock() {
  const now = new Date();
  const yyyy = now.getFullYear();
  const MM = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  
  document.getElementById('clock').textContent = `${yyyy}-${MM}-${dd} ${hh}:${mm}:${ss}`;
}
setInterval(updateClock, 1000);
updateClock();

// --- 翻頁面板邏輯 ---
// 確保包含了所有機場目的地與航空公司的中文字，並去除重複
const rawChars = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:-金門澎湖台東馬祖東京首爾上海廈門羽田金浦浦東立榮華信虎航長榮華航成田大阪關西仁川曼谷洛杉磯舊金山新加坡香港澳門星宇國泰沖繩胡志明市紐約倫敦巴黎雪梨北京首都虹橋日航全日空聯合達美快運英航台北國際機場樂桃新航酷航阿聯酋吉隆坡準點出發登機中延誤關閉已起飛";
const CHARS = Array.from(new Set(rawChars.split(''))).join('');

const remarks = ["準點出發", "登機中", "延誤", "艙門關閉", "已起飛"];

const boardEl = document.getElementById('board');
let audioCtx = null;
let isAudioEnabled = false;

// --- 音效防破音修復 ---
let compressor = null;
let masterGain = null;

function enableAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-24, audioCtx.currentTime);
    compressor.ratio.setValueAtTime(12, audioCtx.currentTime);
    
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0.6;
    
    compressor.connect(masterGain);
    masterGain.connect(audioCtx.destination);
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  isAudioEnabled = true;
  const msg = document.getElementById('unlock-msg');
  if (msg) msg.style.opacity = '0';
}

function playFlapSound() {
  if (!audioCtx || !isAudioEnabled) return;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  
  osc.type = 'square';
  osc.frequency.setValueAtTime(150 + Math.random() * 100, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.02);
  
  gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime); 
  gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.02);
  
  osc.connect(gainNode);
  gainNode.connect(compressor);
  
  osc.start();
  osc.stop(audioCtx.currentTime + 0.03);
}

function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function padStr(str, len) { 
  let res = str;
  while(res.length < len) res += ' ';
  return res.substring(0, len);
}

function isChinese(char) {
  return /[一-龥]/.test(char);
}

function generateData() {
  const h = String(Math.floor(Math.random() * 24)).padStart(2, '0');
  const m = String(Math.floor(Math.random() * 60)).padStart(2, '0');
  const flightNum = Math.floor(Math.random() * 900) + 100;
  const gate = String(Math.floor(Math.random() * 90) + 1);
  
  return {
    time: padStr(`${h}:${m}`, 5),
    dest: padStr(getRandomItem(currentDests), 4),
    flight: padStr(`${getRandomItem(currentAirlines)}${flightNum}`, 6),
    gate: padStr(gate, 2),
    remarks: padStr(getRandomItem(remarks), 4)
  };
}

const rows = [];
const rowCount = 7; 

function initBoard() {
  for (let i = 0; i < rowCount; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    const initData = generateData();
    
    const cols = [
      { key: 'time', len: 5, className: 'col-time flap-time', val: initData.time },
      { key: 'dest', len: 4, className: 'col-dest flap-dest', val: initData.dest },
      { key: 'flight', len: 6, className: 'col-flight flap-flight', val: initData.flight },
      { key: 'gate', len: 2, className: 'col-gate flap-gate', val: initData.gate },
      { key: 'remarks', len: 4, className: 'col-remarks flap-remarks', val: initData.remarks }
    ];

    row._flaps = {};

    cols.forEach(col => {
      const container = document.createElement('div');
      container.className = `flap-container ${col.className}`;
      row._flaps[col.key] = [];
      
      const chars = col.val.split('');
      for (let j = 0; j < col.len; j++) {
        const flap = document.createElement('div');
        flap.className = 'flap';
        if (isChinese(chars[j])) flap.classList.add('zh');
        flap.textContent = chars[j] || ' ';
        container.appendChild(flap);
        row._flaps[col.key].push(flap);
      }
      row.appendChild(container);
    });
    
    boardEl.appendChild(row);
    rows.push(row);
  }
}

function flipChar(flapEl, targetChar) {
  return new Promise(resolve => {
    let currentIdx = CHARS.indexOf(flapEl.textContent);
    if (currentIdx === -1) currentIdx = 0;
    const targetIdx = CHARS.indexOf(targetChar);
    if (targetIdx === -1) { 
      flapEl.textContent = ' '; 
      flapEl.classList.remove('zh');
      resolve(); 
      return; 
    }
    
    if (currentIdx === targetIdx) { resolve(); return; }

    let interval = setInterval(() => {
      currentIdx = (currentIdx + 1) % CHARS.length;
      const nextChar = CHARS[currentIdx];
      
      if (isChinese(nextChar)) flapEl.classList.add('zh');
      else flapEl.classList.remove('zh');
      
      flapEl.textContent = nextChar;
      playFlapSound();
      
      if (currentIdx === targetIdx) {
        clearInterval(interval);
        resolve();
      }
    }, 30 + Math.random() * 20);
  });
}

function updateBoard() {
  rows.forEach((row, rowIndex) => {
    setTimeout(() => {
      const data = generateData();
      Object.keys(data).forEach(key => {
        const str = data[key];
        str.split('').forEach((char, charIndex) => {
          setTimeout(() => {
            flipChar(row._flaps[key][charIndex], char);
          }, charIndex * 60); 
        });
      });
    }, rowIndex * 250); 
  });
}

initBoard();

// 點擊互動：啟用聲音並隱藏提示
document.addEventListener('click', (e) => {
  // 若點擊輸入框則不立刻刷新面板，只啟用音效
  enableAudio();
  if (e.target.id !== 'airport-input' && e.target.id !== 'unlock-msg') {
    // 點擊其他空白處可手動刷新
    // updateBoard(); // 避免與每分鐘更新衝突，此處註解掉手動點擊刷新，僅依賴輸入與定時
  }
});

function scheduleNextUpdate() {
  const now = new Date();
  const msUntilNextMinute = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
  
  setTimeout(() => {
    updateBoard();
    scheduleNextUpdate(); 
  }, msUntilNextMinute);
}

scheduleNextUpdate();

</script>
</body>
</html>
